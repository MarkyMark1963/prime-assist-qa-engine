<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Assist QA Engine</title>
<style>body{font:18px system-ui;background:#f3f6fa;color:#172338;margin:0}main{max-width:950px;margin:40px auto;padding:24px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,textarea,button{font:inherit;padding:12px;box-sizing:border-box}input,textarea{width:100%;margin:8px 0}button{margin:8px 8px 8px 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{overflow-wrap:anywhere}.error{color:#9c1720}</style>
<main><h1>Prime Assist QA Engine</h1><p>Test a fixed candidate. Verify every gate. Record human approval.</p><section><label for="key">QA access key</label><input id="key" type="password" autocomplete="off"><button id="load">Load candidates</button></section><section><label for="patch">Candidate behavior patch</label><textarea id="patch" rows="6"></textarea><button id="create">Save new candidate</button></section><p id="message" role="status"></p><div id="candidates"></div></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let busy=false;const evidenceByCandidate=new Map();
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'x-qa-key':$('key').value,'content-type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const d=await api('/api/candidates');$('candidates').innerHTML=d.candidates.map(c=>`<section><h2>${c.approved?'Human approved':'Candidate'}</h2><small>${esc(c.id)}<br>Navigator version: ${esc(c.version)}</small><pre>${esc(JSON.stringify(c.jobs||[],null,2))}</pre><button data-id="${c.id}" data-action="run">Run next gate</button><button data-id="${c.id}" data-action="retry">Retry technical failure</button><button data-id="${c.id}" data-action="repair">Repair development failures</button><button data-id="${c.id}" data-action="evidence">View development evidence</button><button data-id="${c.id}" data-action="approve">Record human approval</button></section>`).join('')||'<p>No candidates yet.</p>';for(const section of $('candidates').querySelectorAll('section')){const id=section.querySelector('[data-id]')?.dataset.id;if(evidenceByCandidate.has(id)){const pre=document.createElement('pre');pre.className='evidence';pre.textContent=evidenceByCandidate.get(id);section.appendChild(pre)}}}
async function perform(fn){if(busy)return;busy=true;try{$('message').textContent='Working…';await fn();$('message').textContent='Saved.';await load()}catch(e){$('message').textContent=e.message}finally{busy=false}}
$('load').onclick=()=>perform(load);$('create').onclick=()=>perform(()=>api('/api/candidates','POST',{patch:$('patch').value}));
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='evidence'){perform(async()=>{const d=await api('/api/candidates/'+b.dataset.id+'/evidence');let pre=b.parentElement.querySelector('.evidence');if(!pre){pre=document.createElement('pre');pre.className='evidence';b.parentElement.appendChild(pre)}const evidenceText=JSON.stringify(d,null,2);evidenceByCandidate.set(b.dataset.id,evidenceText);pre.textContent=evidenceText});return}let note;if(b.dataset.action==='approve'){note=prompt('Record your human review and remaining limits. Approval does not deploy.');if(!note)return}perform(()=>api('/api/candidates/'+b.dataset.id+'/'+b.dataset.action,'POST',note?{note}:{}))});
setInterval(()=>{if($('key').value&&!busy)load().catch(()=>{})},5000);
</script></html>
